<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📚 Study Planner App</h1>

    <hr>

    <h2>Add Subject</h2>

    <input type="text" id="subjectInput"
           placeholder="Enter Subject Name">

    <button onclick="addSubject()">
        Add Subject
    </button>

    <h3>Subjects List</h3>
    <ul id="subjectList"></ul>

    <hr>

    <h2>Add Study Task</h2>

    <input type="text" id="taskInput"
           placeholder="Enter Task">

    <input type="date" id="taskDate">

    <button onclick="addTask()">
        Add Task
    </button>

    <h3>Task List</h3>
    <ul id="taskList"></ul>

    <hr>

    <h2>Exam Reminder</h2>

<input type="text" id="examInput"
placeholder="Enter Exam Name">

<input type="date" id="examDate">

<button onclick="addExam()">
    Add Exam
</button>

<ul id="examList"></ul>
    <hr>

    <h2>Attendance</h2>
<input type="number" id="totalClasses"
placeholder="Total Classes">

<input type="number" id="attendedClasses"
placeholder="Attended Classes">

<button onclick="calculateAttendance()">
    Calculate Attendance
</button>

<p id="attendanceResult"></p>
    
    <script>

        function addSubject() {

            let subject =
                document.getElementById(
                    "subjectInput"
                ).value;

            let li =
                document.createElement("li");

            li.innerText = subject;

            document.getElementById(
                "subjectList"
            ).appendChild(li);

            document.getElementById(
                "subjectInput"
            ).value = "";
        }


        function addTask() {

            let task =
                document.getElementById(
                    "taskInput"
                ).value;

            let date =
                document.getElementById(
                    "taskDate"
                ).value;

            let li =
                document.createElement("li");

            li.innerText =
                task + " - " + date;

            document.getElementById(
                "taskList"
            ).appendChild(li);

            document.getElementById(
                "taskInput"
            ).value = "";

            document.getElementById(
                "taskDate"
            ).value = "";
        }

    </script>
    <script src="script.js"></script>

    <div class="container">

    </div>

</body>
</html>
